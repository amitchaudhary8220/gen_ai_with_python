[project]
name = "gen-ai-with-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "ollama>=0.6.3",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
gen-ai-with-python = "gen_ai_with_python:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "generator_and_decorator/generators",
    "gen_ai/rag",
    "python_learnings/concurrency_and_parallelism",
    "python_learnings/async_python_learning",
    "gen_ai/rag_queue",
]
